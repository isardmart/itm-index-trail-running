<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">Modifiers plug into the core through guarded hooks</title>
  <desc id="d">Optional modifiers (age, carried load, your own) declare their inputs and implement up to four hooks: effort, decay, threshold and readiness. Every hook passes through the core's guards: it only sees declared inputs, never future data, its result is clamped to 0.5–1.5 (body mass to at most 1.1), and missing data makes it a no-op. Without modifiers, the core gives exactly the isardtrail.com results.</desc>
  <style>
    .bg { fill: #fcfcfb; } .card { fill: #f3f2ee; stroke: #e0ded8; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .core { fill: #2a78d6; } .core-ink { fill: #ffffff; } .core-ink2 { fill: #dbe9fa; }
    .guard { fill: none; stroke: #2a78d6; } .guard-ink { fill: #1f63b5; } .wire { stroke: #8f8d86; }
    .dash { stroke: #b5b3ab; } .hook { fill: #fcfcfb; stroke: #c9c7bf; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; } .card { fill: #262624; stroke: #3a3936; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .core { fill: #3987e5; } .core-ink { fill: #0b0b0b; } .core-ink2 { fill: #10233b; }
      .guard { stroke: #3987e5; } .guard-ink { fill: #7db3f2; } .wire { stroke: #8a8880; }
      .dash { stroke: #4a4945; } .hook { fill: #1a1a19; stroke: #4a4945; }
    }
    svg { font-size: 13px; } text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 700; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .step { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
  </style>
  <rect class="bg" width="880" height="300" rx="16"/>

  <!-- Modifiers -->
  <text class="ink2 step" x="24" y="34">MODIFIERS · OFF BY DEFAULT</text>
  <rect class="card" x="24" y="48" width="236" height="64" rx="10"/>
  <text class="ink h" x="40" y="74">age</text><text class="ink2" x="40" y="96" font-size="12">masters grading of thresholds</text>
  <rect class="card" x="24" y="124" width="236" height="64" rx="10"/>
  <text class="ink h" x="40" y="150">carried-load</text><text class="ink2" x="40" y="172" font-size="12">running with a pack adds up to 10 %</text>
  <rect class="card" x="24" y="200" width="236" height="64" rx="10" stroke-dasharray="5 4"/>
  <text class="ink h" x="40" y="226">your modifier</text><text class="ink2" x="40" y="248" font-size="12">evidence-based, with references</text>

  <!-- Hooks -->
  <g class="wire" stroke-width="1.5" fill="none">
    <path d="M260,80 C300,80 300,128 336,128"/><path d="M260,80 C300,80 300,164 336,164"/>
    <path d="M260,156 C300,156 300,92 336,92"/><path d="M260,232 C300,232 300,200 336,200"/>
  </g>
  <text class="ink2 step" x="336" y="34">HOOKS</text>
  <g class="mono">
    <rect class="hook" x="336" y="78" width="172" height="28" rx="6"/><text class="ink" x="348" y="96.5">effortMultiplier</text>
    <rect class="hook" x="336" y="114" width="172" height="28" rx="6"/><text class="ink" x="348" y="132.5">decayMultiplier</text>
    <rect class="hook" x="336" y="150" width="172" height="28" rx="6"/><text class="ink" x="348" y="168.5">thresholdMultiplier</text>
    <rect class="hook" x="336" y="186" width="172" height="28" rx="6"/><text class="ink" x="348" y="204.5">readinessRequirements</text>
  </g>

  <!-- Guards around the core -->
  <rect class="guard" x="540" y="48" width="316" height="216" rx="14" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="guard-ink step" x="556" y="72">GUARDS</text>
  <g class="wire" stroke-width="1.5">
    <line x1="508" y1="92" x2="540" y2="92"/><line x1="508" y1="128" x2="540" y2="128"/>
    <line x1="508" y1="164" x2="540" y2="164"/><line x1="508" y1="200" x2="540" y2="200"/>
  </g>
  <text class="ink2" x="556" y="96" font-size="12">• declared inputs only</text>
  <text class="ink2" x="556" y="116" font-size="12">• never future data</text>
  <text class="ink2" x="556" y="136" font-size="12">• clamped to ×0.5–×1.5</text>
  <text class="ink2" x="706" y="96" font-size="12">• missing data → no-op</text>
  <text class="ink2" x="706" y="116" font-size="12">• body mass: ×1.1 max</text>
  <text class="ink2" x="706" y="136" font-size="12">• no pain or fasting</text>
  <rect class="core" x="560" y="170" width="276" height="76" rx="10"/>
  <text class="core-ink h" x="698" y="200" text-anchor="middle">ITM core engine</text>
  <text class="core-ink2" x="698" y="222" text-anchor="middle" font-size="12">no modifiers → exactly the</text>
  <text class="core-ink2" x="698" y="238" text-anchor="middle" font-size="12">isardtrail.com results (golden test)</text>

  <text class="ink2" x="24" y="288" font-size="12">Modifiers never change the defaults: they are opt-in, and every effect is bounded by the core.</text>
</svg>
