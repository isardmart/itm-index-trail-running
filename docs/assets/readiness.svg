<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">Ready for a category = fitness + preparation</title>
  <desc id="d">Example for a 100K: ITM 540 of 500 needed passes; longest day 58 of 50, back-to-back 64 of 60, 12-week volume 712 of 650 and strength 1.4 of 1 per week pass; a night run (0 of 1) and a finished 50K or longer race are missing, so the athlete is not ready yet.</desc>
  <style>
    .bg { fill: #fcfcfb; } .card { fill: #f3f2ee; stroke: #e0ded8; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .ok { fill: #1d7f3f; } .no { fill: #c4352f; } .rule { stroke: #e0ded8; } .op { fill: #8f8d86; }
    .bar-bg { fill: #e6e5e0; } .bar { fill: #2a78d6; } .need { stroke: #0b0b0b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; } .card { fill: #262624; stroke: #3a3936; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .ok { fill: #5cc47e; } .no { fill: #f07a70; } .rule { stroke: #3a3936; } .op { fill: #8a8880; }
      .bar-bg { fill: #3a3936; } .bar { fill: #3987e5; } .need { stroke: #f0efec; }
    }
    svg { font-size: 13px; } text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 700; } .step { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
  <rect class="bg" width="880" height="330" rx="16"/>

  <!-- Fitness -->
  <rect class="card" x="24" y="24" width="250" height="282" rx="12"/>
  <text class="ink2 step" x="44" y="52">FITNESS</text>
  <text class="ink h" x="44" y="76">ITM ≥ threshold</text>
  <rect x="44" y="96" width="12" height="12" rx="3" fill="#52c458"/>
  <text class="ink" x="62" y="106.5" font-weight="700">100K</text>
  <text class="ink2" x="104" y="106.5">needs ITM 500</text>
  <rect class="bar-bg" x="44" y="130" width="210" height="14" rx="7"/>
  <rect class="bar" x="44" y="130" width="210" height="14" rx="7"/>
  <line class="need" x1="238.4" x2="238.4" y1="124" y2="150" stroke-width="2"/>
  <text class="ink2 num" x="238.4" y="166" text-anchor="middle" font-size="11">500</text>
  <text class="ink num" x="44" y="200" font-size="34" font-weight="800">540</text>
  <text class="ok" x="44" y="226" font-weight="700">✓ fit for a 100K</text>
  <text class="ink2" x="44" y="262" font-size="12">Fitness alone is not enough:</text>
  <text class="ink2" x="44" y="280" font-size="12">a 100K also needs the right</text>
  <text class="ink2" x="44" y="298" font-size="12">kind of preparation →</text>

  <text class="op" x="292" y="172" font-size="28" font-weight="700" text-anchor="middle">+</text>

  <!-- Preparation -->
  <rect class="card" x="310" y="24" width="546" height="282" rx="12"/>
  <text class="ink2 step" x="330" y="52">PREPARATION · 100K</text>
  <text class="ink2 step" x="700" y="52" text-anchor="end">HAVE</text>
  <text class="ink2 step" x="770" y="52" text-anchor="end">NEED</text>
  <g class="num">
    <text class="ok" x="330" y="84" font-weight="700">✓</text><text class="ink" x="352" y="84">Longest day (12 weeks)</text>
    <text class="ink" x="700" y="84" text-anchor="end">58</text><text class="ink2" x="770" y="84" text-anchor="end">50</text>
    <line class="rule" x1="330" x2="836" y1="98" y2="98"/>
    <text class="ok" x="330" y="120" font-weight="700">✓</text><text class="ink" x="352" y="120">Back-to-back, two days (12 weeks)</text>
    <text class="ink" x="700" y="120" text-anchor="end">64</text><text class="ink2" x="770" y="120" text-anchor="end">60</text>
    <line class="rule" x1="330" x2="836" y1="134" y2="134"/>
    <text class="ok" x="330" y="156" font-weight="700">✓</text><text class="ink" x="352" y="156">Volume (12 weeks, km effort)</text>
    <text class="ink" x="700" y="156" text-anchor="end">712</text><text class="ink2" x="770" y="156" text-anchor="end">650</text>
    <line class="rule" x1="330" x2="836" y1="170" y2="170"/>
    <text class="ok" x="330" y="192" font-weight="700">✓</text><text class="ink" x="352" y="192">Strength &amp; mobility per week (8 weeks)</text>
    <text class="ink" x="700" y="192" text-anchor="end">1.4</text><text class="ink2" x="770" y="192" text-anchor="end">1</text>
    <line class="rule" x1="330" x2="836" y1="206" y2="206"/>
    <text class="no" x="330" y="228" font-weight="700">✗</text><text class="ink" x="352" y="228">Night runs (12 months)</text>
    <text class="ink" x="700" y="228" text-anchor="end">0</text><text class="ink2" x="770" y="228" text-anchor="end">1</text>
    <text class="no" x="836" y="228" text-anchor="end" font-size="12" font-weight="700">missing</text>
    <line class="rule" x1="330" x2="836" y1="242" y2="242"/>
    <text class="no" x="330" y="264" font-weight="700">✗</text><text class="ink" x="352" y="264">Finished race: 50K or longer (24 months)</text>
    <text class="ink" x="700" y="264" text-anchor="end">No</text>
    <text class="no" x="836" y="264" text-anchor="end" font-size="12" font-weight="700">missing</text>
  </g>
  <text class="ink2" x="330" y="292" font-size="12">Result: <tspan class="ink" font-weight="700">not ready for a 100K yet</tspan> — still ready for a 50K. Values in km effort.</text>
</svg>
