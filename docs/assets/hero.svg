<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="t d">
  <title id="t">ITM · Isard Trail Meters</title>
  <desc id="d">A mountain drawn to scale of the ITM: bands for 20K (ITM 110), 50K (250), 100K (500), 100M (850) and UTMB (1200), in the official UTMB category colours.</desc>
  <style>
    .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .gap { stroke: #fcfcfb; }
    .valley { fill: #d9d7cf; } .snow { fill: #eef3f8; } .snow-edge { stroke: #b9c3cf; } .lead { stroke: #c9c7bf; stroke-width: 1; }
    .chip { fill: #f0efe9; stroke: #e0ded8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; } .gap { stroke: #1a1a19; }
      .valley { fill: #3d3c38; } .snow-edge { stroke: #eef3f8; } .lead { stroke: #4a4945; }
      .chip { fill: #262624; stroke: #3a3936; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <!-- To scale: base y = 250, y = 250 − ITM × 0.15 (the summit is ITM ≈ 1530). -->
    <clipPath id="mountain">
      <path d="M380,250 L470,195 L505,208 L560,150 L590,160 L650,20 L700,110 L725,100 L790,190 L820,180 L840,250 Z"/>
    </clipPath>
  </defs>
  <rect class="bg" width="880" height="280" rx="16"/>
  <text class="ink" x="40" y="92" font-size="56" font-weight="800" letter-spacing="-1">ITM</text>
  <text class="ink" x="40" y="126" font-size="22" font-weight="600">Isard Trail Meters</text>
  <text class="ink2" x="40" y="160" font-size="15">One open number for trail-running fitness:</text>
  <text class="ink2" x="40" y="181" font-size="15">which race you could run now, and what is</text>
  <text class="ink2" x="40" y="202" font-size="15">still missing for the next one.</text>
  <rect class="chip" x="40" y="222" width="94" height="26" rx="13"/>
  <text class="ink2" x="87" y="239.5" font-size="12" text-anchor="middle">TypeScript</text>
  <rect class="chip" x="142" y="222" width="104" height="26" rx="13"/>
  <text class="ink2" x="194" y="239.5" font-size="12" text-anchor="middle">0 dependencies</text>
  <rect class="chip" x="254" y="222" width="94" height="26" rx="13"/>
  <text class="ink2" x="301" y="239.5" font-size="12" text-anchor="middle">deterministic</text>

  <g clip-path="url(#mountain)">
    <rect class="valley" x="370" y="233.50" width="480" height="18.50"/>
    <rect x="370" y="212.50" width="480" height="21.00" fill="#f6dc2d"/>
    <rect x="370" y="175.00" width="480" height="37.50" fill="#f0782a"/>
    <rect x="370" y="122.50" width="480" height="52.50" fill="#52c458"/>
    <rect x="370" y="70.00" width="480" height="52.50" fill="#e0372f"/>
    <rect class="snow" x="370" y="10" width="480" height="60.00"/>
    <g class="gap" stroke-width="2">
      <line x1="370" x2="850" y1="233.50" y2="233.50"/>
      <line x1="370" x2="850" y1="212.50" y2="212.50"/>
      <line x1="370" x2="850" y1="175.00" y2="175.00"/>
      <line x1="370" x2="850" y1="122.50" y2="122.50"/>
      <line x1="370" x2="850" y1="70.00" y2="70.00"/>
    </g>
  </g>
  <path class="snow-edge" d="M628.6,70 L650,20 L677.8,70" fill="none" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Labels, each at its level threshold. -->
  <g font-size="12">
    <line class="lead" x1="680" x2="796" y1="70.00" y2="70.00"/>
    <text class="ink" x="802" y="74.00" font-weight="700">UTMB</text>
    <text class="ink2" x="802" y="88.00">1200</text>
    <line class="lead" x1="743" x2="796" y1="122.50" y2="122.50"/>
    <text class="ink" x="802" y="126.50" font-weight="700">100M</text>
    <text class="ink2" x="802" y="140.50">850</text>
    <line class="lead" x1="446" x2="534" y1="175.00" y2="175.00"/>
    <text class="ink" x="440" y="179.00" font-weight="700" text-anchor="end">100K</text>
    <text class="ink2" x="440" y="193.00" text-anchor="end">500</text>
    <line class="lead" x1="424" x2="439" y1="212.50" y2="212.50"/>
    <text class="ink" x="418" y="216.50" font-weight="700" text-anchor="end">50K</text>
    <text class="ink2" x="418" y="230.50" text-anchor="end">250</text>
    <text class="ink" x="844" y="237.50" font-weight="700">20K</text>
    <text class="ink2" x="844" y="251.50">110</text>
  </g>
  <text class="ink2" x="620" y="270" font-size="11" text-anchor="middle">Each band starts at its level's ITM threshold</text>
</svg>
